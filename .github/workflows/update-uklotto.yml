name: Update UK Lotto results
on:
  schedule:
    # Lotto: Wed & Sat ~20:00 UK. EuroMillions: Tue & Fri ~20:00 UK.
    # GitHub often delays crons by an hour or more, and a source can be down for a
    # while — retry several times after each draw instead of once, plus a daily catch-all.
    - cron: '30 22 * * 2,3,5,6'   # right after the draw
    - cron: '30 1 * * 3,4,6,0'    # +3h
    - cron: '30 7 * * 3,4,6,0'    # +9h
    - cron: '30 13 * * 3,4,6,0'   # +15h (prize breakdowns confirmed)
    - cron: '0 6 * * *'           # daily safety net
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # v4 app feed (Lotto numbers) — must never be broken
      - run: python scripts/update_uklotto.py
      # v5 app feed (Lotto both rounds + EuroMillions with real UK prizes)
      - run: python scripts/uk_results.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet uklotto_recent.json uk_results.json; then
            git config user.name "uklotto-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uklotto_recent.json uk_results.json
            git commit -m "Auto-update UK results"
            git push
          else
            echo "No change."
          fi
